name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and manifest versions differ' }
      - run: npm test
      - run: npm run release:build
      - run: npm run release:verify
      - name: Publish installable archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = (Get-Content package.json -Raw | ConvertFrom-Json).name
          gh release create "v$version" "dist/$name-$version.tgz" "dist/$name-$version-windows.zip" "dist/SHA256SUMS.txt" --verify-tag --title "v$version" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
